{% block table %}
    <div class="w-3/4 border rounded-lg overflow-hidden dark:border-slate-500">
        <table class="min-w-full divide-y dark:divide-slate-500">
            <thead class="bg-slate-200 dark:bg-slate-700">
                <tr>
                    {% for column in columns %}
                    <th>{{ column.title }}</th>
                    {% endfor %}
                    <th colspan="3">{{ coverage_title }}</th>
                </tr>
                <tr hx-get="{{ content_uri }}" hx-trigger="input delay:500ms" hx-include="this" hx-target="#{{ target }}">
                    {% for column in columns %}
                    <td class="bg-slate-100 dark:bg-slate-800 pl-4"><input type="text" name="{{ column.key }}" value="" placeholder="Filter..." class="bg-transparent outline-none"></td>
                    {% endfor %}
                    <th>Branch</th>
                    <th>Function</th>
                    <th>Line</th>
                </tr>
            </thead>
            <tbody id="{{ target }}" class="divide-y dark:divide-slate-500">
                {% include table_body.html %}
            </tbody>
        </table>
    </div>
{% endblock table %}
