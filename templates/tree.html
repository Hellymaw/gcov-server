{% extends "base.html" %}
{% block content %}
    <table class="table-auto rounded-lg border-2 mx-auto w-3/4">
        <thead>
            <tr>
                <th rowspan="2" class="bg-slate-400 border border-slate-600 rounded-tl-lg">Type</th>
                <th rowspan="2" class="bg-slate-400 border border-slate-600">Name</th>
                <th colspan="3" class="bg-slate-400 border border-slate-600 rounded-tr-lg">Coverage Summary</th>
            </tr>
            <tr>
                <th class="bg-slate-400 border border-slate-600">Branch</th>
                <th class="bg-slate-400 border border-slate-600">Function</th>
                <th class="bg-slate-400 border border-slate-600">Line</th>
            </tr>
        </thead>
        <tbody>
            {% for file in files %}
            <tr>
                <td class="bg-slate-500 border border-slate-700 pl-4">placeholder3</td>
                <td class="bg-slate-500 border border-slate-700 pl-4"><a href="/{{owner}}/{{repo}}/{% if file.is_dir %}tree{% else %}blob{% endif %}/{{commit}}{{path}}/{{file.name}}" class="hover:text-blue-800 visited:text-purple-600">{{file.name}}</a></td>
                <td class="bg-slate-500 border border-slate-700 text-center">placeholder0</td>
                <td class="bg-slate-500 border border-slate-700 text-center">placeholder1</td>
                <td class="bg-slate-500 border border-slate-700 text-center">placeholder2</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock content %}
