{% extends "base.html" %}
{% block content %}
    <table class="table-auto">
        <thead>
            <tr>
                <th rowspan="2" class="border border-slate-600">Type</th>
                <th rowspan="2" class="border border-slate-600">Name</th>
                <th colspan="3" class="border border-slate-600">Coverage Summary</th>
            </tr>
            <tr>
                <th class="border border-slate-600">Branch</th>
                <th class="border border-slate-600">Function</th>
                <th class="border border-slate-600">Line</th>
            </tr>
        </thead>
        <tbody>
            {% for file in files %}
            <tr>
                <td class="border border-slate-700">placeholder3</td>
                {% if file.is_dir %}
                    <td class="border border-slate-700"><a href="/{{owner}}/{{repo}}/tree/{{commit}}{{path}}/{{file.name}}">{{file.name}}</td>
                {% else %}
                    <td class="border border-slate-700"><a href="/{{owner}}/{{repo}}/blob/{{commit}}{{path}}/{{file.name}}">{{file.name}}</td>
                {% endif %}
                <td class="border border-slate-700">placeholder0</td>
                <td class="border border-slate-700">placeholder1</td>
                <td class="border border-slate-700">placeholder2</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock content %}
