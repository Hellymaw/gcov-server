{% for summary in summaries %}
<tr>
    {% if root %}<td>{{summary.org}}</td>{% endif %}
    <td><a href="/{{summary.org}}/{{summary.repo}}">{{summary.repo}}</a></td>
    <td>{{summary.coverage.branch}}</td>
    <td>{{summary.coverage.function}}</td>
    <td>{{summary.coverage.line}}</td>
</tr>
{% endfor %}
