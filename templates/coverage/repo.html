<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>{{org}}/{{repo}} Coverage</title>
</head>
<script src="https://unpkg.com/htmx.org@2.0.3"></script>

<body>
<h1>{{org}}/{{repo}}</h1>
<a href="/top_level.html">home</a>
<table>
    <thead>
        <tr>
            <th rowspan="2">Branch</th>
            <th rowspan="2">Commit</th>
            <th colspan="3">Latest Coverage</th>
        </tr>
        <tr>
            <th>Branch</th>
            <th>Function</th>
            <th>Line</th>
        </tr>
        <tr hx-get="/{{org}}/{{repo}}/summaries" hx-trigger="load, input delay:500ms" hx-include="this" hx-target="#summaries">
            <td><input type="text" name="branch" value=""></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
        </tr>
    </thead>
    <tbody id="summaries">
</table>
</body>
</html>
