<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
</head>

<body>
<table>
    <tr>
        <th>Line</th>
        <th>Branch</th>
        <th>Exec</th>
        <th>Source</th>
    </tr>
    {% for line in source_lines %}
    <tr>
        <td>{{line.line_number}}</td>
        <td>taken/not</td>
        <td>exec</td>
        <td>{{line.source}}</td>
    </tr>
    {% endfor %}
</table>
</body>
</html>
