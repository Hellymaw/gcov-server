{% extends "base.html" %}
{% block content %}
<h1>{{owner}}/{{repo}}</h1>
<table>
    <thead>
        <tr>
            <th rowspan="2">Branch</th>
            <th rowspan="2">Commit</th>
            <th colspan="3">Latest Coverage</th>
        </tr>
        <tr>
            <th>Branch</th>
            <th>Function</th>
            <th>Line</th>
        </tr>
        <tr hx-get="/{{owner}}/{{repo}}/summaries" hx-trigger="load, input delay:500ms" hx-include="this" hx-target="#summaries">
            <td><input type="text" name="branch" value=""></td>
            <td></td>
            <td></td>
            <td></td>
            <td></td>
        </tr>
    </thead>
    <tbody id="summaries">
</table>
{% endblock content %}
